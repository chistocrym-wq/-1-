<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/otto-blank-192.png?v=8" />
    <link rel="manifest" href="/manifest.webmanifest?v=8" />
    <link rel="apple-touch-icon" href="/otto-blank-512.png?v=8" />
    <link rel="preload" as="image" href="/otto-full-transparent.webp?v=8" type="image/webp" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F7D74" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Отто A1" />
    <meta name="description" content="Тренажёр для подготовки к Goethe-Zertifikat A1" />
    <title>Тренажёр Отто — Goethe A1</title>

    <style>
      :root {
        background: #0F7D74;
        color-scheme: light;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      html,
      body {
        margin: 0;
        background: #0F7D74 !important;
      }

      #otto-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #0F7D74;
        opacity: 1;
        visibility: visible;
        isolation: isolate;
        transition: opacity .62s cubic-bezier(.22,.61,.36,1), visibility .62s linear;
      }

      #otto-launch.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .otto-launch__hero {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 50%;
        display: block;
        width: auto;
        height: auto;
        max-width: 92vw;
        max-height: 90vh;
        opacity: 0;
        transform: translate(-50%, -46%) scale(.94);
        filter: blur(12px);
        image-rendering: auto;
        -webkit-user-drag: none;
        user-select: none;
        will-change: opacity, transform, filter;
        transition:
          opacity 1.15s cubic-bezier(.22,.61,.36,1),
          transform 1.25s cubic-bezier(.22,.61,.36,1),
          filter 1.05s cubic-bezier(.22,.61,.36,1);
      }

      #otto-launch.show-otto .otto-launch__hero {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
      }

      #otto-launch.dissolve .otto-launch__hero {
        opacity: 0;
        transform: translate(-50%, -51%) scale(1.025);
        filter: blur(5px);
        transition-duration: .5s;
      }

      .otto-launch__particles {
        position: absolute;
        z-index: 5;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .otto-shard {
        position: absolute;
        z-index: 6;
        background-image: url('/otto-full-transparent.webp?v=8');
        background-repeat: no-repeat;
        opacity: 1;
        will-change: transform, opacity, filter;
        animation: otto-shard-away 1.45s cubic-bezier(.18,.7,.22,1) var(--delay) forwards;
      }

      @keyframes otto-shard-away {
        0% {
          opacity: .96;
          filter: blur(0);
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        38% {
          opacity: .74;
        }
        100% {
          opacity: 0;
          filter: blur(2px);
          transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.18);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .otto-launch__hero,
        #otto-launch {
          transition-duration: .25s !important;
        }
        .otto-shard {
          display: none;
        }
      }
    </style>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js?v=8').then(function (registration) {
            registration.update().catch(function () {});
          }).catch(function (error) {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <div id="otto-launch" aria-hidden="true">
      <img
        id="otto-launch-hero"
        class="otto-launch__hero"
        src="/otto-full-transparent.webp?v=8"
        alt=""
        decoding="async"
        fetchpriority="high"
      />
      <div class="otto-launch__particles" aria-hidden="true"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        var splash = document.getElementById('otto-launch');
        var hero = document.getElementById('otto-launch-hero');
        var particles = splash && splash.querySelector('.otto-launch__particles');
        if (!splash || !hero) return;

        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var timers = [];

        function later(fn, ms) {
          timers.push(window.setTimeout(fn, ms));
        }

        function makeImageShards() {
          if (!particles || reduced) return;

          particles.textContent = '';

          var rect = hero.getBoundingClientRect();
          if (!rect.width || !rect.height) return;

          var splashRect = splash.getBoundingClientRect();
          var cols = 12;
          var rows = 20;
          var cellW = rect.width / cols;
          var cellH = rect.height / rows;
          var frag = document.createDocumentFragment();

          for (var row = 0; row < rows; row++) {
            for (var col = 0; col < cols; col++) {
              if (Math.random() < .12) continue;

              var shard = document.createElement('i');
              shard.className = 'otto-shard';

              var left = rect.left - splashRect.left + col * cellW;
              var top = rect.top - splashRect.top + row * cellH;
              var dx = (Math.random() - .5) * 210;
              var dy = -40 - Math.random() * 210 + row * 1.5;
              var rot = (Math.random() - .5) * 300;
              var delay = Math.random() * .28;

              shard.style.left = left + 'px';
              shard.style.top = top + 'px';
              shard.style.width = (cellW + .7) + 'px';
              shard.style.height = (cellH + .7) + 'px';
              shard.style.backgroundSize = rect.width + 'px ' + rect.height + 'px';
              shard.style.backgroundPosition = (-col * cellW) + 'px ' + (-row * cellH) + 'px';
              shard.style.setProperty('--dx', dx + 'px');
              shard.style.setProperty('--dy', dy + 'px');
              shard.style.setProperty('--rot', rot + 'deg');
              shard.style.setProperty('--delay', delay + 's');

              frag.appendChild(shard);
            }
          }

          particles.appendChild(frag);
        }

        function removeSplash() {
          timers.forEach(function (id) { window.clearTimeout(id); });
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }

        if (reduced) {
          later(function () { splash.classList.add('show-otto'); }, 800);
          later(function () { splash.classList.add('is-leaving'); }, 2400);
          later(removeSplash, 2750);
          return;
        }

        // 0–3.0 s: absolutely nothing except the brand teal screen.
        // At 3 s Otto fades in at full height.
        later(function () {
          splash.classList.add('show-otto');
        }, 3000);

        // Keep Otto visible, then break the actual image into small translucent pieces.
        later(function () {
          makeImageShards();
          splash.classList.add('dissolve');
        }, 6150);

        // Reveal the already-rendered main screen underneath.
        later(function () {
          splash.classList.add('is-leaving');
        }, 7350);

        later(removeSplash, 8050);

        // Last-resort safety so the splash can never trap the app.
        later(function () {
          if (document.body.contains(splash)) removeSplash();
        }, 11000);
      })();
    </script>
  </body>
</html>
