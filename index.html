<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/otto-blank-192.png?v=13" />
    <link rel="manifest" href="/manifest.webmanifest?v=13" />
    <link rel="apple-touch-icon" href="/otto-blank-512.png?v=13" />
    <link rel="preload" as="image" href="/otto.png?v=13" type="image/png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#118d84" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Отто A1" />
    <meta name="description" content="Тренажёр для подготовки к Goethe-Zertifikat A1" />
    <title>Тренажёр Отто — Goethe A1</title>
    <style>
      :root, html, body, #root { min-height: 100%; margin: 0; background: #118d84; color-scheme: light; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      // Remove legacy PWA caches/service workers so Telegram WebView cannot keep serving the old splash.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) { registration.unregister(); });
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.filter(function (key) { return key.indexOf('otto-a1-') === 0; })
            .forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
