<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/otto-icon-192.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/otto-icon-512.webp" />
    <link rel="preload" as="image" href="/otto-splash-hq.webp" type="image/webp" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F7D74" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Отто A1" />
    <meta name="description" content="Тренажёр для подготовки к Goethe-Zertifikat A1" />
    <title>Тренажёр Отто — Goethe A1</title>
    <style>
      html, body, #root { min-height: 100%; }
      html, body { margin: 0; background: #0F7D74; }

      #otto-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #0F7D74;
        opacity: 1;
        visibility: visible;
        filter: blur(0);
        transition:
          opacity .62s cubic-bezier(.22,.61,.36,1),
          filter .62s cubic-bezier(.22,.61,.36,1),
          visibility .62s linear;
      }

      #otto-launch.is-leaving {
        opacity: 0;
        filter: blur(5px);
        visibility: hidden;
        pointer-events: none;
      }

      .otto-launch__image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        background: #0F7D74;
        image-rendering: auto;
        -webkit-user-drag: none;
        user-select: none;
      }

      @media (min-width: 800px) {
        .otto-launch__image {
          width: min(100%, 760px);
          margin: 0 auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #otto-launch { transition-duration: .25s; }
        #otto-launch.is-leaving { filter: none; }
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      window.__ottoLaunchStarted = performance.now();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="otto-launch" aria-hidden="true">
      <img
        class="otto-launch__image"
        src="/otto-splash-hq.webp"
        alt=""
        width="1000"
        height="1778"
        decoding="sync"
        fetchpriority="high"
      />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var splash = document.getElementById('otto-launch');
        if (!splash) return;

        function finishLaunch() {
          var elapsed = performance.now() - (window.__ottoLaunchStarted || 0);
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var minDuration = reduced ? 700 : 1850;
          var wait = Math.max(0, minDuration - elapsed);

          window.setTimeout(function () {
            splash.classList.add('is-leaving');
            window.setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, reduced ? 280 : 680);
          }, wait);
        }

        if (document.readyState === 'complete') {
          finishLaunch();
        } else {
          window.addEventListener('load', finishLaunch, { once: true });
        }

        window.setTimeout(function () {
          if (document.body.contains(splash)) {
            splash.classList.add('is-leaving');
            window.setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 680);
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
