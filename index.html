<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/photo_5228950309122547432_c.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/otto.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F7D74" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Отто A1" />
    <meta name="description" content="Тренажёр для подготовки к Goethe-Zertifikat A1" />
    <title>Тренажёр Отто — Goethe A1</title>
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #0F7D74; }

      #otto-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #0F7D74;
        color: #fff;
        font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity .42s ease, visibility .42s ease;
      }

      #otto-launch.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .otto-launch__halo {
        position: absolute;
        width: min(82vw, 520px);
        aspect-ratio: 1;
        left: 50%;
        top: 8.5%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(24, 166, 153, .32);
      }

      .otto-launch__curve {
        position: absolute;
        width: 145vw;
        height: 42vh;
        left: -24vw;
        top: 40vh;
        border: 3px solid rgba(130, 225, 215, .19);
        border-radius: 50%;
        transform: rotate(-17deg);
      }

      .otto-launch__inner {
        position: relative;
        z-index: 2;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(14px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
      }

      .otto-launch__stage {
        position: relative;
        flex: 1 1 auto;
        width: min(94vw, 560px);
        min-height: 0;
        margin-top: 4px;
        animation: otto-breathe 1.8s ease-in-out infinite;
      }

      .otto-launch__frame {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(72vw, 390px);
        max-width: 100%;
        max-height: 66vh;
        height: auto;
        object-fit: contain;
        transform: translateX(-50%);
        transform-origin: 50% 82%;
        filter: drop-shadow(0 18px 18px rgba(0, 52, 48, .22));
        will-change: opacity, transform;
      }

      .otto-launch__frame--a { animation: otto-frame-a .86s ease-in-out infinite; }
      .otto-launch__frame--b { animation: otto-frame-b .86s ease-in-out infinite; }

      .otto-launch__copy {
        flex: 0 0 auto;
        width: 100%;
        max-width: 720px;
        text-align: center;
        padding: 6px 0 1vh;
        text-shadow: 0 2px 8px rgba(0, 55, 51, .14);
      }

      .otto-launch__title {
        font-weight: 800;
        font-size: clamp(27px, 7.5vw, 52px);
        line-height: 1.03;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }

      .otto-launch__accent {
        width: clamp(112px, 27vw, 180px);
        height: 5px;
        margin: 15px auto 14px;
        border-radius: 999px;
        background: #B9F2D6;
        transform: rotate(-2deg);
      }

      .otto-launch__subtitle {
        font-size: clamp(17px, 4.45vw, 28px);
        line-height: 1.25;
        font-weight: 400;
      }

      .otto-launch__helper {
        margin-top: 12px;
        font-size: clamp(15px, 3.9vw, 22px);
        line-height: 1.2;
        font-weight: 400;
        opacity: .98;
      }

      @keyframes otto-frame-a {
        0%, 42%, 100% { opacity: 1; transform: translateX(-50%) rotate(-.4deg); }
        52%, 92% { opacity: 0; transform: translateX(-50%) rotate(.5deg); }
      }

      @keyframes otto-frame-b {
        0%, 42%, 100% { opacity: 0; transform: translateX(-50%) rotate(.35deg); }
        52%, 92% { opacity: 1; transform: translateX(-50%) rotate(-.45deg); }
      }

      @keyframes otto-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @media (max-height: 700px) {
        .otto-launch__stage { margin-top: 0; }
        .otto-launch__frame { width: min(63vw, 330px); max-height: 59vh; }
        .otto-launch__accent { margin-top: 9px; margin-bottom: 9px; }
        .otto-launch__helper { margin-top: 7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .otto-launch__stage,
        .otto-launch__frame { animation: none !important; }
        .otto-launch__frame--b { display: none; }
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      window.__ottoLaunchStarted = performance.now();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="otto-launch" aria-hidden="true">
      <div class="otto-launch__halo"></div>
      <div class="otto-launch__curve"></div>
      <div class="otto-launch__inner">
        <div class="otto-launch__stage">
          <img class="otto-launch__frame otto-launch__frame--a" src="/otto-wave-1.webp" alt="" />
          <img class="otto-launch__frame otto-launch__frame--b" src="/otto-wave-2.webp" alt="" />
        </div>
        <div class="otto-launch__copy">
          <div class="otto-launch__title">Тренажёр Отто А1</div>
          <div class="otto-launch__accent"></div>
          <div class="otto-launch__subtitle">Подготовимся к экзамену вместе</div>
          <div class="otto-launch__helper">Ваш помощник</div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var splash = document.getElementById('otto-launch');
        if (!splash) return;

        function finishLaunch() {
          var elapsed = performance.now() - (window.__ottoLaunchStarted || 0);
          var minDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 650 : 2200;
          var wait = Math.max(0, minDuration - elapsed);
          setTimeout(function () {
            splash.classList.add('is-leaving');
            setTimeout(function () { splash.remove(); }, 460);
          }, wait);
        }

        if (document.readyState === 'complete') finishLaunch();
        else window.addEventListener('load', finishLaunch, { once: true });

        setTimeout(function () {
          if (document.body.contains(splash)) {
            splash.classList.add('is-leaving');
            setTimeout(function () { splash.remove(); }, 460);
          }
        }, 6000);
      })();
    </script>
  </body>
</html>
